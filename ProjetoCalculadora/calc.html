<!DOCTYPE html>
<html lang="pt-Br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Calculadora</title>
    <link rel="stylesheet" href="calc.css">
</head>

<body>
    <main>
        <header>
            <h1>Calculadora Digital</h1>
        </header>
        <input type="text">
        <nav id="bloco">
            <button class="Corrigir">C</button>
            <button class="sinal">+/-</button>
            <button class="porcent">%</button>
            <button class="divisao">/</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="multp">x</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="subtra">-</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="soma">+</button>
            <button class="zero">0</button>
            <button class="virg">,</button>
            <button class="igual">=</button>
        </nav>


    </main>
    <script src="calc.js"></script>
</body>


</html>
